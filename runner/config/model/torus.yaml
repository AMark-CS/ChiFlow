# Configuration for ChiFlow model using high-dimensional torus flow
model_name: "chiflow"

# Basic parameters
num_aa_types: 21   # Standard amino acid types

# High-dimensional torus flow configuration
flow:
  num_hidden_dims: 512
  num_hidden_layers: 4
  num_mixtures: 3
  # Stochastic Flow Matching parameters
  stochastic_paths: false
  g: 0.1
  min_sigma: 0.01

# Feature dimensions
residue_feat_dim: 256
pair_feat_dim: 128
n_context_dims: 256
time_embed_dim: 64

# Encoder configurations
residue_encoder:
  feat_dim: ${model.residue_feat_dim}
  max_num_atoms: 37  # Standard atom37 representation
  num_aa_types: 21   # Standard amino acid types (hardcoded for compatibility)

pair_encoder:
  feat_dim: ${model.pair_feat_dim}
  max_num_residues: 512

# Context network
context_net:
  hidden_dim: ${model.n_context_dims}

# Time embedding
time_embed:
  dim: ${model.time_embed_dim}

# Mirror operator constraints
mirror_constraint_weight: 1.0
use_mirror_constraint: true

# Optimal Transport parameters
ot_plan: false
ot_fn: "exact"  # "exact" or "sinkhorn"
reg: 0.05      # regularization for Sinkhorn OT

# Sampling parameters
sampling:
  num_steps: 100
  noise_scale: 0.1

# Training parameters
training:
  batch_size: 4
  learning_rate: 1e-4
  num_epochs: 100