data:
  csv_path: /root/autodl-fs/ChiFlow/data/metadata_one.csv
  cluster_path: /root/autodl-fs/ChiFlow/data/clusters-by-entity-30.txt
  filtering:
    max_len: 512
    min_len: 60
    subset: null
    allowed_oligomer:
    - monomeric
    max_helix_percent: 1.0
    max_loop_percent: 0.5
    min_beta_percent: -1.0
    rog_quantile: 0.96
  min_t: 0.01
  samples_per_eval_length: 4
  num_eval_lengths: 10
  num_t: 100
  max_same_res: 50
  num_csv_processors: 5
  cache_full_dataset: false
flow_matcher:
  flow_trans: true
  flow_rot: true
  ot_fn: exact
  reg: 0.05
  ot_plan: false
  stochastic_paths: false
  r3:
    min_b: 0.01
    min_sigma: 0.01
    max_b: 20.0
    coordinate_scaling: 0.1
    g: 0.1
  so3:
    min_sigma: 0.01
    max_sigma: 1.5
    axis_angle: true
    inference_scaling: -0.01
    g: 0.1
model:
  model_name: chiflow
  num_aa_types: 21
  flow:
    num_hidden_dims: 512
    num_hidden_layers: 4
    num_mixtures: 3
  residue_feat_dim: 256
  pair_feat_dim: 128
  n_context_dims: 256
  time_embed_dim: 64
  residue_encoder:
    feat_dim: ${model.residue_feat_dim}
    max_num_atoms: 37
    num_aa_types: ${model.num_aa_types}
  pair_encoder:
    feat_dim: ${model.pair_feat_dim}
    max_num_residues: 512
  context_net:
    hidden_dim: ${model.n_context_dims}
  time_embed:
    dim: ${model.time_embed_dim}
  sampling:
    num_steps: 100
    noise_scale: 0.1
  training:
    batch_size: 4
    learning_rate: 0.0001
    num_epochs: 100
experiment:
  name: baseline
  run_id: null
  use_ddp: false
  log_freq: 100
  batch_size: 256
  eval_batch_size: ${data.samples_per_eval_length}
  num_loader_workers: 12
  torch_num_threads: 8
  num_epoch: 500
  learning_rate: 0.0001
  max_squared_res: 500000
  prefetch_factor: 100
  use_gpu: true
  num_gpus: 1
  sample_mode: cluster_time_batch
  ckpt_freq: 5000
  eval_freq: 5000
  early_ckpt: true
  warm_start: null
  use_warm_start_conf: false
  ckpt_dir: ./ckpt/
  full_ckpt_dir: ${experiment.ckpt_dir}/${experiment.name}/
  trans_loss_weight: 1.0
  rot_loss_weight: 0.5
  rot_loss_t_threshold: 0.0
  separate_rot_loss: true
  trans_x0_threshold: 0.0
  coordinate_scaling: ${flow_matcher.r3.coordinate_scaling}
  bb_atom_loss_weight: 1.0
  bb_atom_loss_t_filter: 0.25
  dist_mat_loss_weight: 1.0
  dist_mat_loss_t_filter: 0.25
  aux_loss_weight: 0.25
  eval_dir: ./
  noise_scale: 1.0
  num_parameters: null
wandb:
  use_wandb: true
  entity: null
  project: se3-fm
  dir: ./
  tags: null
  group: null
  offline: false
  job_type: null
start_time_string: default
conda_env: se3
inference:
  name: chiflow_torus_example
  gpu_id: 0
  seed: 42
  full_ckpt_dir: ./ckpt/
  pt_hub_dir: ./hub/checkpoints
  pmpnn_dir: ./ProteinMPNN/
  output_dir: ./results_torus
  weights_path: ./ckpt/baseline/step_50.pth
  torus_mode: true
  torus_num_steps: 50
  flow:
    num_t: 100
    noise_scale: 0.1
    min_t: 0.01
  samples:
    samples_per_length: 10
    seq_per_sample: 8
    min_length: 50
    max_length: 150
    length_step: 50
